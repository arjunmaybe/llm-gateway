# M1 gateway configuration. Secrets must NOT go here — use environment variables.
server:
  host: "127.0.0.1"
  port: 8000

logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR

routing:
  default_provider: "mock-a"
  # Canonical model name -> provider name. Strict-subset demo mapping.
  model_aliases:
    "mock": "mock-a"
    "mock-a": "mock-a"
    "mock-b": "mock-b"

# M2 resilience tuning. Env vars (GATEWAY_RETRY_*, GATEWAY_CIRCUIT_*) win over YAML.
resilience:
  retry:
    max_attempts: 2  # total attempts per provider, first attempt counts
    backoff_base_ms: 50.0
    backoff_max_ms: 1000.0
    max_elapsed_ms: 8000.0  # cap on total backoff sleeping per request
  circuit_breaker:
    failure_threshold: 5  # consecutive failures before OPEN
    recovery_timeout_s: 30.0  # OPEN -> HALF_OPEN probe delay
    half_open_max_inflight: 1  # concurrent recovery probes per provider

providers:
  - name: "mock-a"
    type: "mock"
    enabled: true
    priority: 10
    timeout_s: 5.0
    mock:
      latency_ms: 0.0
      fail_rate: 0.0
      failure_mode: "unavailable"  # timeout | unavailable | rate_limited | connection | permanent
      response_tokens: 24
  - name: "mock-b"
    type: "mock"
    enabled: true
    priority: 20
    timeout_s: 5.0
    mock:
      latency_ms: 0.0
      fail_rate: 0.0
      failure_mode: "unavailable"
      response_tokens: 12

# OpenRouter (real providers). Enabled — requires OPENROUTER_API_KEY in env.
# Primary / fallback pair: the gateway's real router (RouterEngine +
# ResilientExecutor) tries them in priority order and falls back on failure.
# See live_openrouter_test.py for a live primary -> fallback demonstration.
  - name: "openrouter-primary"
    type: "openrouter"
    enabled: true
    priority: 30
    timeout_s: 30.0
    openrouter:
      model: "google/gemma-4-31b-it:free"
  - name: "openrouter-fallback"
    type: "openrouter"
    enabled: true
    priority: 31
    timeout_s: 30.0
    openrouter:
      model: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
