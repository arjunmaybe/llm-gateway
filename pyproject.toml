[project]
name = "llm-gateway"
version = "0.1.0"
description = "High-Performance LLM Gateway (M1: minimal offline gateway)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<0.117",
  "uvicorn[standard]>=0.29,<0.31",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<0.28",
  "structlog>=24.1,<25",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "httpx>=0.27,<0.28",
]
dev = [
  "ruff>=0.4,<0.6",
  "mypy>=1.10,<2",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[tool.uvicorn]
app = "src.main:app"
